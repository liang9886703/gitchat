<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>连接你的求知空间</title>
  <link rel="stylesheet" href="launcher.css">
  <script src="launcher.js" defer></script>
</head>
<body>
  <main>
    <a class="brand" href="index.html?settings=1" aria-label="求知连接首页"><span class="mark">求</span><span>求知<small>GitChat</small></span></a>
    <header><p class="eyebrow">把思考展开，让答案慢慢清晰</p><h1>接着你的好奇，<br>继续向前。</h1><p>同一套卡片，同一个思考节奏。<br>选择在这台设备开始，或回到已有的空间。</p></header>
    <section class="local-card" id="local-card" hidden aria-labelledby="local-title">
      <div><h2 id="local-title">在这台电脑开始</h2><p>对话保存在本机。无需部署服务，即可体验卡片探索。</p></div>
      <button id="local-button" class="primary" type="button">打开本地空间 <span aria-hidden="true">↗</span></button>
      <small>未配置模型时使用演示回答。连接同一远程服务可在多端继续探索。</small>
    </section>
    <section class="remote-card" aria-labelledby="remote-title">
      <h2 id="remote-title">连接已有的空间</h2>
      <p>输入你部署的求知服务地址。在不同设备连接同一地址后，可通过「设备配对」继续原来的对话。</p>
      <form id="connect-form">
        <label for="server-url">服务地址</label>
        <input id="server-url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://qiuzhi.example.com" required aria-describedby="url-hint">
        <p id="url-hint" class="hint">远程地址需启用 HTTPS。本机开发可使用 http://127.0.0.1:8002。</p>
        <button id="connect-button" class="primary" type="submit">连接空间 <span aria-hidden="true">↗</span></button>
      </form>
    </section>
    <p class="status" id="status" role="status" aria-live="polite" hidden></p>
    <footer>你的模型密钥保留在服务端。<br><span id="return-hint">稍后可在应用的「连接与本地空间」中切换。</span></footer>
  </main>
</body>
</html>
