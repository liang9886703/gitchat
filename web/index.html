<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fb">
  <title>求知 · GitChat</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="对话导航">
      <a class="brand" href="/" aria-label="求知首页"><span class="brand-mark">求</span><span>求知<small>GitChat</small></span></a>
      <button class="new-session" data-action="new"><span>＋</span> 开始新的探索</button>
      <nav class="collections">
        <button data-action="collection" data-value="sessions" class="active"><span>◫</span> 我的探索</button>
        <button data-action="collection" data-value="favorites"><span>☆</span> 收藏的卡片</button>
        <button data-action="collection" data-value="archive"><span>▤</span> 归档与历史</button>
      </nav>
      <div class="sidebar-label">最近对话</div>
      <div id="sessions" class="session-list"></div>
      <div class="sidebar-bottom"><button data-action="import"><span>↙</span> 导入分享</button><button data-action="settings"><span>⚙</span> 我的偏好</button><div id="mode" class="mode-label">正在连接…</div></div>
    </aside>
    <button id="sidebar-scrim" class="scrim" aria-label="关闭导航" data-action="sidebar"></button>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" data-action="sidebar" aria-label="打开导航">☰</button>
        <div class="page-heading"><span id="page-title">新的探索</span><small id="page-subtitle">一个问题，一个新的方向</small></div>
        <div class="view-switch" aria-label="切换视图"><button data-action="view" data-value="focus" class="active">专注</button><button data-action="view" data-value="overview">思维图</button></div>
        <button class="icon-button" data-action="session-menu" aria-label="对话操作" title="对话操作">···</button>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="workspace-footer"><span id="footer-mode"></span><button data-action="help">手势与快捷操作</button></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
</body>
</html>
