<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式聊天界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .form-section {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            background-color: white;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .response-section {
            padding: 20px;
            min-height: 200px;
        }

        .response-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #495057;
        }

        #streamOutput {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #212529;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .table-section {
            padding: 20px;
            border-top: 2px solid #e9ecef;
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #495057;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.streaming {
            background: #d4edda;
            color: #155724;
        }

        .status.completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 流式聊天界面</h1>
            <p>实时接收和显示流式响应</p>
        </div>

        <div class="form-section">
            <form id="chatForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="domain">域名/IP</label>
                        <input type="text" id="domain" value="http://localhost:8002" placeholder="http://localhost:8002" required>
                    </div>
                    <div class="form-group">
                        <label for="path">路径</label>
                        <input type="text" id="path" value="/g/1" placeholder="/g/1" required>
                    </div>
                    <div class="form-group">
                        <label for="ifFirst">ifFirst</label>
                        <select id="ifFirst" required>
                            <option value="true" selected>true</option>
                            <option value="false">false</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">消息内容</label>
                    <textarea id="message" rows="3" placeholder="输入你的问题..." required>什么是wsl技术</textarea>
                </div>
                <button type="submit" id="submitBtn">发送请求</button>
            </form>
        </div>

        <div class="response-section">
            <div class="response-title">📝 流式响应内容</div>
            <div id="streamOutput" class="empty-state">等待发送请求...</div>
        </div>

        <div class="table-section">
            <div class="table-title">📊 响应历史记录</div>
            <table id="responseTable">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>时间</th>
                        <th>状态</th>
                        <th>完整响应</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="empty-state">暂无数据</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let responseCount = 0;
        let currentResponse = {
            content: '',
            startTime: null,
            endTime: null,
            status: 'streaming',
            fullResponse: null
        };
        let currentTableRow = null; // 当前表格行，用于更新

        const form = document.getElementById('chatForm');
        const streamOutput = document.getElementById('streamOutput');
        const tableBody = document.getElementById('tableBody');
        const submitBtn = document.getElementById('submitBtn');

        // HTML 转义函数，防止 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const domain = document.getElementById('domain').value.trim();
            const path = document.getElementById('path').value.trim();
            const message = document.getElementById('message').value.trim();
            const ifFirst = document.getElementById('ifFirst').value === 'true';

            if (!domain || !path || !message) {
                alert('请填写所有字段');
                return;
            }

            // 重置状态
            streamOutput.textContent = '';
            streamOutput.classList.remove('empty-state');
            currentResponse = {
                content: '',
                startTime: new Date(),
                endTime: null,
                status: 'streaming',
                fullResponse: null
            };
            currentTableRow = null; // 重置表格行引用

            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';

            const url = `${domain}${path}`;
            const requestBody = {
                ifFirst: ifFirst,
                stream: true,
                message: {
                    content: [{
                        type: "text",
                        text: [message]
                    }]
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                // 先判断状态码，如果不是 200，直接中止
                if (response.status !== 200) {
                    currentResponse.endTime = new Date();
                    currentResponse.status = response.status.toString();
                    currentResponse.content = `HTTP 错误: ${response.status} ${response.statusText}`;
                    streamOutput.textContent = currentResponse.content;
                    
                    // 尝试读取错误响应体
                    try {
                        const errorText = await response.text();
                        if (errorText) {
                            currentResponse.content += `\n${errorText}`;
                            streamOutput.textContent = currentResponse.content;
                        }
                    } catch (e) {
                        // 忽略读取错误响应体的错误
                    }
                    
                    // 更新表格并返回
                    if (currentTableRow) {
                        updateTableRow();
                    } else {
                        addToTable();
                    }
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        currentResponse.endTime = new Date();
                        currentResponse.status = 'completed';
                        // 更新表格行的状态为已完成
                        updateTableRow();
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    
                    // 处理 SSE 格式
                    // 可能的情况：
                    // 1. stream: {...}event:stream\ndata:{...}
                    // 2. event:stream\ndata:{...}
                    // 3. data:{...}
                    
                    // 先处理可能在同一行的情况：stream: {...}event:stream
                    if (buffer.includes('event:') && !buffer.includes('\n')) {
                        // 如果 buffer 中包含 event: 但没有换行，说明可能在同一行
                        // 继续读取直到有换行
                        continue;
                    }
                    
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;

                        // 处理可能在同一行的情况：stream: {...}event:stream
                        if (line.includes('event:') && line.includes('stream: ')) {
                            // 找到 event: 的位置
                            const eventIndex = line.indexOf('event:');
                            if (eventIndex > 0) {
                                // 提取 event: 之后的部分
                                line = line.substring(eventIndex);
                            } else {
                                continue;
                            }
                        }

                        // 忽略 Go 结构体输出（stream: {0x...}）
                        if (line.startsWith('stream: ') && (line.includes('0x') || line.includes('{') && !line.includes('"'))) {
                            // 这是 fmt.Printf 输出的 Go 结构体，检查后面是否有 event:
                            const eventIndex = line.indexOf('event:');
                            if (eventIndex > 0) {
                                line = line.substring(eventIndex);
                            } else {
                                continue;
                            }
                        }

                        // 处理 event: 行
                        if (line.startsWith('event:')) {
                            const eventType = line.substring(6).trim();
                            console.log('事件类型:', eventType);
                            continue;
                        }

                        // 处理 data: 行（标准 SSE 格式）
                        if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            if (!dataStr) continue;

                            try {
                                const data = JSON.parse(dataStr);
                                processStreamData(data);
                            } catch (e) {
                                // 解析失败，直接中止
                                console.error('解析 JSON 失败:', e, '数据:', dataStr.substring(0, 100));
                                currentResponse.endTime = new Date();
                                currentResponse.status = 'parse_error';
                                currentResponse.content += `\n[解析错误] 无法解析响应数据: ${e.message}\n原始数据: ${dataStr.substring(0, 200)}`;
                                streamOutput.textContent = currentResponse.content;
                                
                                // 更新表格并退出循环
                                if (currentTableRow) {
                                    updateTableRow();
                                } else {
                                    addToTable();
                                }
                                break; // 退出 while 循环
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('请求失败:', error);
                streamOutput.textContent = `错误: ${error.message}`;
                currentResponse.status = 'error';
                currentResponse.endTime = new Date();
                // 如果有表格行，更新状态；否则创建新行
                if (currentTableRow) {
                    updateTableRow();
                } else {
                    addToTable();
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发送请求';
            }
        });

        function processStreamData(data) {
            const isFirstResponse = !currentResponse.fullResponse;
            
            // 保存完整响应（合并多个响应）
            if (isFirstResponse) {
                currentResponse.fullResponse = JSON.parse(JSON.stringify(data)); // 深拷贝
                // 收到第一条响应时，创建表格行
                addToTable();
            } else {
                // 合并响应数据
                // 1. 合并 message.content.text 数组（追加）
                if (data.message && data.message.content && data.message.content.text) {
                    if (!currentResponse.fullResponse.message) {
                        currentResponse.fullResponse.message = {};
                    }
                    if (!currentResponse.fullResponse.message.content) {
                        currentResponse.fullResponse.message.content = {};
                    }
                    if (!currentResponse.fullResponse.message.content.text) {
                        currentResponse.fullResponse.message.content.text = [];
                    }
                    // 合并 text 数组（追加新内容）
                    if (Array.isArray(data.message.content.text)) {
                        currentResponse.fullResponse.message.content.text.push(
                            ...data.message.content.text
                        );
                    }
                }
                
                // 2. 更新其他字段（以最后一次响应为准）
                if (data.appid && data.appid.MainId) {
                    currentResponse.fullResponse.appid = data.appid;
                }
                if (data.session && data.session.MainId) {
                    currentResponse.fullResponse.session = data.session;
                }
                if (data.version && data.version.MainId) {
                    currentResponse.fullResponse.version = data.version;
                }
                
                // 3. 更新 message 的其他字段（以最后一次响应为准）
                if (data.message) {
                    if (!currentResponse.fullResponse.message) {
                        currentResponse.fullResponse.message = {};
                    }
                    // 更新 message 的其他字段（除了 content.text，因为 text 是追加的）
                    if (data.message.update_time) {
                        currentResponse.fullResponse.message.update_time = data.message.update_time;
                    }
                    if (data.message.status) {
                        currentResponse.fullResponse.message.status = data.message.status;
                    }
                    if (data.message.id) {
                        currentResponse.fullResponse.message.id = data.message.id;
                    }
                    if (data.message.create_time) {
                        currentResponse.fullResponse.message.create_time = data.message.create_time;
                    }
                    // 更新 content 的其他字段（除了 text）
                    if (data.message.content) {
                        if (!currentResponse.fullResponse.message.content) {
                            currentResponse.fullResponse.message.content = {};
                        }
                        if (data.message.content.type) {
                            currentResponse.fullResponse.message.content.type = data.message.content.type;
                        }
                    }
                }
                
                // 后续响应只更新表格行的完整响应内容
                updateTableRow();
            }

            // 提取文本内容 - 从 message.content.text 字段
            if (data.message && data.message.content && data.message.content.text) {
                const textArray = data.message.content.text;
                if (Array.isArray(textArray)) {
                    textArray.forEach(text => {
                        if (typeof text === 'string' && text.trim()) {
                            currentResponse.content += text;
                            streamOutput.textContent = currentResponse.content;
                            // 自动滚动到底部
                            streamOutput.scrollTop = streamOutput.scrollHeight;
                        }
                    });
                } else if (typeof textArray === 'string') {
                    // 如果 text 是字符串而不是数组
                    currentResponse.content += textArray;
                    streamOutput.textContent = currentResponse.content;
                    streamOutput.scrollTop = streamOutput.scrollHeight;
                }
            }

            // 处理错误
            if (data.error) {
                currentResponse.status = 'error';
                currentResponse.content += `\n[错误] ${data.error}`;
                streamOutput.textContent = currentResponse.content;
            }

            // 更新状态
            if (data.message && data.message.status) {
                if (data.message.status === 'success' || data.message.status === 'completed') {
                    // 状态会在流结束时设置为 completed
                }
            }
        }

        function addToTable() {
            responseCount++;
            
            // 移除空状态行
            if (tableBody.querySelector('.empty-state')) {
                tableBody.innerHTML = '';
            }

            // 创建新行
            currentTableRow = document.createElement('tr');
            updateTableRowContent(currentTableRow);
            tableBody.appendChild(currentTableRow);

            // 保存完整响应数据
            currentTableRow.dataset.fullResponse = JSON.stringify(currentResponse.fullResponse || {});
        }

        function updateTableRow() {
            if (currentTableRow) {
                updateTableRowContent(currentTableRow);
            }
        }

        function updateTableRowContent(row) {
            // 判断状态类型：状态码（数字字符串）、completed、error、parse_error、streaming
            let statusClass = 'streaming';
            let statusText = '流式传输中';
            
            // 检查是否是状态码（纯数字字符串）
            if (/^\d+$/.test(currentResponse.status)) {
                statusClass = 'error';
                statusText = `HTTP ${currentResponse.status}`;
            } else if (currentResponse.status === 'completed') {
                statusClass = 'completed';
                statusText = '已完成';
            } else if (currentResponse.status === 'error') {
                statusClass = 'error';
                statusText = '错误';
            } else if (currentResponse.status === 'parse_error') {
                statusClass = 'error';
                statusText = '解析错误';
            }

            // 创建用于显示的响应副本，将 message.content.text 替换为省略号
            let displayResponse = null;
            if (currentResponse.fullResponse) {
                displayResponse = JSON.parse(JSON.stringify(currentResponse.fullResponse)); // 深拷贝
                // 如果存在 message.content.text 数组，替换为省略号
                if (displayResponse.message && 
                    displayResponse.message.content && 
                    displayResponse.message.content.text && 
                    Array.isArray(displayResponse.message.content.text) &&
                    displayResponse.message.content.text.length > 0) {
                    // 保留数组结构，但内容替换为省略号
                    displayResponse.message.content.text = ['...'];
                }
            }

            // 格式化完整响应为 JSON
            const fullResponseJson = displayResponse 
                ? JSON.stringify(displayResponse, null, 2)
                : '{}';

            // 更新行内容
            row.innerHTML = `
                <td>${responseCount}</td>
                <td>${currentResponse.startTime ? currentResponse.startTime.toLocaleTimeString() : '-'}</td>
                <td><span class="status ${statusClass}">${statusText}</span></td>
                <td style="max-width: 800px; max-height: 300px; overflow: auto; font-family: 'Courier New', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; background: #f8f9fa; padding: 10px; border-radius: 4px; line-height: 1.4;">${escapeHtml(fullResponseJson)}</td>
            `;

            // 更新保存的完整响应数据（保存完整数据，不修改）
            row.dataset.fullResponse = JSON.stringify(currentResponse.fullResponse || {});
        }

        // 存储所有响应数据
        const allResponses = [];

        // 修改 processStreamData 函数，保存响应
        const originalProcessStreamData = processStreamData;
        processStreamData = function(data) {
            originalProcessStreamData(data);
            if (!allResponses[responseCount]) {
                allResponses[responseCount] = [];
            }
            allResponses[responseCount].push(data);
        };

        // 修改 addToTable 函数，保存完整响应
        const originalAddToTable = addToTable;
        addToTable = function() {
            allResponses[responseCount] = currentResponse.fullResponse;
            originalAddToTable();
        };

        function showFullResponse(index) {
            const response = allResponses[index] || currentResponse.fullResponse;
            if (response) {
                alert('完整响应:\n\n' + JSON.stringify(response, null, 2));
            } else {
                alert('暂无完整响应数据');
            }
        }

        // 暴露到全局作用域
        window.showFullResponse = showFullResponse;
    </script>
</body>
</html>
