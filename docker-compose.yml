services:
  gitchat:
    image: bitnami/golang:latest
    container_name: gitchat
    working_dir: /work
    stdin_open: true   # 等同 -i
    tty: true          # 等同 -t
    command: ["sh"]
    ports:
      - "8002:8002"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - "C:/Users/Administrator/Documents/myContainer/gitchat:/work"
      - "C:/Users/Administrator/Documents/myContainer/gitchat/gocache:/go/pkg/mod"
      - "C:/Users/Administrator/Documents/myContainer/gitchat/gobuildcache:/root/.cache/go-build"
      - "C:/Users/Administrator/.ssh:/root/.ssh"
      - "C:/Users/Administrator/.gitconfig:/root/.gitconfig"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]   # 等同 --gpus all
