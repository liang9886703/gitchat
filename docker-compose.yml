services:
  gitchat:
    build: .
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      GITCHAT_ADDR: "0.0.0.0:8002"
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - gitchat-data:/data
    restart: unless-stopped
volumes:
  gitchat-data:
